<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3. Серая стрелка (skip connection)</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="back" href="index.html">← к списку</a>
<h1>3. Серая стрелка: зачем копия карты</h1>
<p class="lead">Две светлые области с узкой щелью проходят pool и растяжение. Без копии щель пропадает, с копией возвращается. Жми «Дальше» и смотри на оранжевые линии: они показывают, где щель.</p>

<style>
.g9{display:grid;grid-template-columns:100px 24px 100px 24px 100px 24px 100px 24px 100px;justify-content:center;row-gap:4px;align-items:start}
.mp{position:relative;width:100px}
.mp canvas{width:100px;height:100px;image-rendering:pixelated;display:block;border-radius:3px;background:#111}
.mp .ph{width:100px;height:100px;border:1px dashed var(--border-strong);border-radius:3px;box-sizing:border-box}
.mp .lb{font-size:11px;color:var(--text-secondary);text-align:center;margin-top:2px;line-height:1.3;min-height:30px}
.mk{position:absolute;top:0;height:100px;border-left:1px dashed #EF9F27;border-right:1px dashed #EF9F27;pointer-events:none}
.ac{display:flex;align-items:center;justify-content:center;height:100px;font-size:18px;color:var(--text-secondary)}
.cl{font-size:11px;color:var(--text-secondary);text-align:center;line-height:1.3;padding-top:4px}
</style>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
<button id="pv">← Назад</button>
<button id="nx">Дальше →</button>
<button id="al">Показать всё</button>
<select id="gp"><option value="1">Щель 1 пиксель</option><option value="3">Щель 3 пикселя</option></select>
<label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mkc" checked> отмечать, где щель</label>
</div>
<div id="tx" style="font-size:14px;line-height:1.6;background:var(--bg-accent);color:var(--text-accent);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;min-height:46px"></div>
<div class="g9" id="g">
<div style="grid-column:1;grid-row:1" id="c-IN"></div>
<div class="ac" style="grid-column:2;grid-row:1" id="a-conv">→</div>
<div style="grid-column:3;grid-row:1" id="c-F"></div>
<div style="grid-column:4/7;grid-row:1;display:flex;flex-direction:column;justify-content:center;height:100px" id="line"><div class="cl" id="lt"></div><div id="lb" style="border-top:3px dashed #888780;margin:4px 0"></div></div>
<div style="grid-column:7;grid-row:1" id="c-FC"></div>
<div class="ac" style="grid-column:8;grid-row:1" id="a-res">→</div>
<div style="grid-column:9;grid-row:1" id="c-RS"></div>
<div class="cl" style="grid-column:3;grid-row:2" id="v-pool"></div>
<div class="cl" style="grid-column:7;grid-row:2" id="v-up"></div>
<div style="grid-column:3;grid-row:3" id="c-P"></div>
<div class="ac" style="grid-column:4;grid-row:3" id="a-c2">→</div>
<div style="grid-column:5;grid-row:3" id="c-G"></div>
<div class="ac" style="grid-column:6;grid-row:3" id="a-up">↗</div>
<div style="grid-column:7;grid-row:3" id="c-U"></div>
<div class="ac" style="grid-column:8;grid-row:3" id="a-ns">→</div>
<div style="grid-column:9;grid-row:3" id="c-RN"></div>
</div>
<div id="hv" style="margin-top:10px;font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);min-height:18px">наведи мышь на любую карту, чтобы увидеть число в пикселе</div>
<script>
const cl=(a,n,x,y)=>a[Math.min(n-1,Math.max(0,y))*n+Math.min(n-1,Math.max(0,x))];
function conv(a,n,k){const o=new Float32Array(n*n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){let s=0;for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=cl(a,n,x+j-1,y+i-1)*k[i*3+j];o[y*n+x]=s;}return o;}
const GA=[1,2,1,2,4,2,1,2,1].map(v=>v/16);
function pool(a,n){const m=n/2,o=new Float32Array(m*m);for(let y=0;y<m;y++)for(let x=0;x<m;x++)o[y*m+x]=Math.max(a[2*y*n+2*x],a[2*y*n+2*x+1],a[(2*y+1)*n+2*x],a[(2*y+1)*n+2*x+1]);return o;}
function up(a,n){const m=n*2,o=new Float32Array(m*m);for(let y=0;y<m;y++)for(let x=0;x<m;x++)o[y*m+x]=a[(y>>1)*n+(x>>1)];return o;}
const th=v=>Math.min(1,Math.max(0,(v-0.45)*3));
let g=1,step=0,R;
function compute(){const n=16,img=new Float32Array(n*n),gs=7-Math.floor(g/2),ge=7+Math.floor(g/2);
for(let y=3;y<=12;y++)for(let x=2;x<=13;x++)if(x<gs||x>ge)img[y*n+x]=1;
const F=conv(img,n,GA),P=pool(F,n),G=conv(P,8,GA),U=up(G,8);
R={IN:[img,16],F:[F,16],FC:[F,16],P:[P,8],G:[G,8],U:[U,16],RN:[U.map(th),16],RS:[U.map((v,i)=>th(v*F[i])),16]};}
const LAB={IN:'вход 16×16',F:'F: после свёрток 16×16',FC:'копия F (серая стрелка)',P:'после pool 8×8',G:'после свёрток 8×8',U:'после растяжения 16×16',RN:'результат БЕЗ копии',RS:'результат С копией'};
const ST={IN:0,F:1,P:2,G:3,U:4,RN:4,FC:5,RS:5};
const TXT=[
'Шаг 0 из 5. Вход 16×16: два светлых пятна, между ними узкая щель. Задача сети: не слить пятна в одно. Оранжевые линии показывают, где щель.',
'Шаг 1 из 5. Свёртки дали карту F (тут для простоты одно размытие). Щель видна: серая полоска. Эту карту мы сохраняем, она «подождёт» на серой стрелке.',
'Шаг 2 из 5. Max pool 2×2: щель попала в один квадрат со светлым пикселем, а максимум у светлого. Щель исчезла. Карта стала 8×8.',
'Шаг 3 из 5. Сеть «думает» дальше на грубой карте. Пятна есть (смысл), а о щели в этой карте уже нет никаких данных.',
'Шаг 4 из 5. Растянули обратно до 16×16. Размер вернулся, а щель вернуть нечем: её в этой карте нет. Справа результат «без копии»: пятна слиты.',
'Шаг 5 из 5. Серая стрелка принесла копию F, и свёртки смотрят на обе карты (U и F). Теперь они знают и «пятна» (из U), и «где точно щель» (из F). Справа сверху результат С копией: щель на месте.'];
const S={};['IN','F','FC','P','G','U','RN','RS'].forEach(id=>{const w=document.getElementById('c-'+id);w.className='mp';w.innerHTML='<div class="ph"></div><div class="lb">'+LAB[id]+'</div>';S[id]=w;});
function draw(cv,id){const [a,n]=R[id];cv.width=n;cv.height=n;const c=cv.getContext('2d'),im=c.createImageData(n,n);for(let i=0;i<n*n;i++){const q=Math.round(Math.min(1,Math.max(0,a[i]))*255);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=q;im.data[i*4+3]=255;}c.putImageData(im,0,0);}
function paint(){
const showMk=document.getElementById('mkc').checked;
for(const id in S){const w=S[id],on=ST[id]<=step;let c=w.firstChild;
if(on){if(c.tagName!=='CANVAS'){const k=document.createElement('canvas');w.replaceChild(k,c);c=k;}draw(c,id);}else if(c.tagName==='CANVAS'){const p=document.createElement('div');p.className='ph';w.replaceChild(p,c);c=p;}
let mk=w.querySelector('.mk');if(mk)mk.remove();
if(on&&showMk){const m=document.createElement('div');m.className='mk';const gs=7-Math.floor(g/2),ge=7+Math.floor(g/2);m.style.left=(gs/16*100)+'px';m.style.width=((ge-gs+1)/16*100-2)+'px';w.insertBefore(m,w.lastChild);}
c.style.outline='';
if(on&&ST[id]===step&&id!=='RN')c.style.outline='3px solid #378ADD';
if(on&&(id==='F'||id==='FC')&&step>=1)c.style.outline='3px solid #EF9F27';
if(on&&id==='RS')c.style.outline='3px solid #639922';
if(on&&id==='RN'&&step>=4)c.style.outline='3px solid #E24B4A';
c.onmousemove=on?(e=>hov(e,id,c)):null;}
document.getElementById('tx').textContent=TXT[step];
document.getElementById('lt').textContent=step>=1?(step>=5?'серая стрелка: копия F едет сюда без изменений':'F ждёт здесь, пока подъём не дойдёт до этого уровня'):'';
document.getElementById('lb').style.opacity=step>=1?1:0.15;
document.getElementById('v-pool').textContent=step>=2?'↓ max pool 2×2':'';
document.getElementById('v-up').textContent=step>=5?'↑ склейка с U, затем свёртки':(step>=4?'↑ растянули':'');
document.getElementById('pv').style.opacity=step?1:0.5;document.getElementById('nx').style.opacity=step<5?1:0.5;
}
function hov(e,id,c){const [a,n]=R[id],r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);if(x>=0&&y>=0&&x<n&&y<n)document.getElementById('hv').textContent=LAB[id]+': x='+x+' y='+y+' значение '+(Math.round(a[y*n+x]*100)/100);}
document.getElementById('nx').onclick=()=>{if(step<5){step++;paint();}};
document.getElementById('pv').onclick=()=>{if(step>0){step--;paint();}};
document.getElementById('al').onclick=()=>{step=5;paint();};
document.getElementById('gp').onchange=e=>{g=+e.target.value;compute();paint();};
document.getElementById('mkc').onchange=paint;
compute();paint();
</script>
</body>
</html>
