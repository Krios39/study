:root {
  --brand: #2c5697;
  --brand-dark: #1b365d;
  --brand-mid: #517db9;
  --brand-light: #96c8e6;
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #333333;
  --muted: #666666;
  --line: #cccccc;
  --allowed: #e8edf4;
  --accent: #2c5697;
  --on-accent: #ffffff;
  --head: #1b365d;
  --good: #4f6a1f;
  --bad: #c42e3b;
  --warn: #8f6333;
  --shade: #1b365d;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10213b;
    --surface: #10213b;
    --ink: #ffffff;
    --muted: #c9d6e8;
    --line: #3f5f8f;
    --allowed: #24447a;
    --accent: #96c8e6;
    --on-accent: #1b365d;
    --head: #ffffff;
    --good: #c3dc91;
    --bad: #f0a6ab;
    --warn: #edb87d;
    --shade: #0b1729;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 Rubik, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: inherit; }
b { font-weight: 700; }
b.good { color: var(--good); }
b.bad { color: var(--bad); }
b.warn { color: var(--warn); }

.top { position: relative; overflow: hidden; background: var(--brand); color: #ffffff; }
.top::before { content: ""; position: absolute; right: -120px; top: -210px; width: 560px; height: 420px; background: var(--brand-mid); transform: rotate(15deg); }
.mast { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 34px 40px 28px; }
.brand h1 { margin: 0; font-size: 40px; font-weight: 700; line-height: 1.1; }
.brand span { display: block; margin-top: 6px; font-size: 19px; }
.other { display: inline-block; margin-top: 14px; color: #ffffff; font-size: 17px; font-weight: 500; }
.hire { display: inline-block; padding: 12px 18px; border: 1px solid rgba(255, 255, 255, 0.55); color: #ffffff; font-size: 16px; font-weight: 400; text-decoration: none; }
.hire b { font-weight: 500; text-decoration: underline; }
.hire:hover { border-color: #ffffff; background: rgba(255, 255, 255, 0.12); }

.tabs { display: flex; }
.top .tabs { position: relative; padding: 0 28px; background: var(--brand-dark); }
.tab { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; border: 0; border-bottom: 5px solid transparent; background: none; color: inherit; font-size: 17px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab em { font-style: normal; font-weight: 700; opacity: 0.6; }
.tab .short { display: none; }
.tab small:not(:empty) { font-size: 15px; font-weight: 700; }
.tab small:not(:empty)::before { content: "· "; font-weight: 400; }
.tab small i { font-style: normal; font-weight: 400; }
.tab.active { border-bottom-color: currentColor; font-weight: 700; }
.tab.active em { opacity: 1; }
.top .tab.active { background: #ffffff; color: var(--brand-dark); border-bottom-color: #ffffff; }
.tab.next:not(.active) { animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { border-bottom-color: currentColor; } }
.tab:disabled { opacity: 0.4; cursor: not-allowed; }

.controls { display: flex; align-items: flex-end; gap: 16px 28px; flex-wrap: wrap; padding: 26px 40px 6px; }
.controls[hidden], main[hidden] { display: none; }
.intro .transport { display: none; }
.intro .wrap { height: 0; overflow: hidden; visibility: hidden; }
.intro .key, .intro aside { display: none; }
.intro .caption { height: auto; min-height: 320px; overflow: visible; }
.ready span { display: block; color: var(--head); font-size: 30px; font-weight: 700; line-height: 1.15; }
.ready span.bad { color: var(--bad); }
.ready b { display: block; margin: 6px 0 14px; color: var(--accent); font-size: 128px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.ready button { height: 56px; padding: 0 28px; font-size: 18px; }
.loader { display: flex; align-items: center; gap: 16px; color: var(--head); font-size: 30px; line-height: 1.15; }
.loader i { width: 30px; height: 30px; background: var(--accent); animation: turn 1.2s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.languages { display: flex; gap: 14px; margin-top: 12px; }
.languages button { padding: 0; border: 0; background: none; color: #ffffff; font: inherit; font-size: 15px; text-decoration: underline; cursor: pointer; }
.languages button.on { font-weight: 700; text-decoration: none; }
.key b, .speed i { font-style: normal; font-weight: inherit; }
.caption button { margin-top: 12px; }
.controls .tabs { margin-right: auto; color: var(--head); border-bottom: 1px solid var(--line); }
.setup, .transport { display: flex; align-items: flex-end; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.field select { height: 46px; padding: 0 12px; border: 2px solid var(--accent); border-radius: 4px; background: var(--surface); font-size: 16px; cursor: pointer; }
button.primary, button.plain, button.toggle { height: 46px; padding: 0 22px; border: 2px solid var(--accent); border-radius: 4px; background: var(--surface); color: var(--accent); font-size: 16px; font-weight: 500; cursor: pointer; }
button.primary { min-width: 104px; background: var(--accent); color: var(--on-accent); }
