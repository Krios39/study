    b.setAttribute("aria-pressed", String(value === current));
    b.onclick = () => onPick(value);
    host.appendChild(b);
  });
}

function render() {
  const inst = DATA[state.instance];
  if (state.solution >= inst.solutions.length) state.solution = 0;
  const sol = inst.solutions[state.solution];
  const P = inst.periods, nSlots = inst.days * P;

  buttons($("instances"), DATA.map((d, i) => [i, d.name]), state.instance, (v) => { state.instance = v; render(); });
  buttons($("solutions"), inst.solutions.map((s, i) => [i, s.label]), state.solution, (v) => { state.solution = v; render(); });
  buttons($("views"), VIEWS, state.view, (v) => { state.view = v; render(); });

  const v = sol.violations;
  const stats = [
    ["Уроков", inst.lessons.length, false],
    ["Не поместилось", v.unassigned, true],
    ["Накладки у классов", v.classClash, true],
    ["Накладки у учителей", v.teacherClash, true],
    ["Окна у классов", v.classGap, true],
    ["Учитель в закрытом слоте", v.teacherUnavailable, true],
    ["Вне смены класса", v.classSlot, true],
    ["Повторы предмета в день", sol.soft.sameSubjectInDay, false],
    ["Перекос уроков по дням", sol.soft.dayImbalance, false],
  ];
  $("stats").innerHTML = stats.map(([label, value, hard]) =>
    `<div class="stat${hard && value > 0 ? " bad" : ""}"><b>${value}</b><span>${label}</span></div>`).join("");
  $("note").textContent = `${inst.classes.length} классов, ${inst.teachers.length} учителей, сетка ${inst.days} × ${P}. ${sol.note}`;

  const off = inst.teacherOff.map((slots) => new Set(slots));
  const byClass = inst.classes.map(() => Array.from({ length: nSlots }, () => []));
  const byTeacher = inst.teachers.map(() => Array.from({ length: nSlots }, () => []));
  const lostByClass = inst.classes.map(() => []);
  inst.lessons.forEach((l, i) => {
    const s = sol.slotOf[i];
    if (s < 0) { lostByClass[l[0]].push(i); return; }
    byClass[l[0]][s].push(i);
    l[2].forEach((t) => byTeacher[t][s].push(i));
  });
  const lessonBad = (i, s) => {
    const l = inst.lessons[i];
    if (byClass[l[0]][s].length > 1) return true;
    const c = inst.classes[l[0]], p = s % P;
    if (p < c.first || p >= c.first + c.max) return true;
    return l[2].some((t) => byTeacher[t][s].length > 1 || off[t].has(s));
  };

  const head = `<tr><th class="p"></th>${DAYS.slice(0, inst.days).map((d) => `<th>${d}</th>`).join("")}</tr>`;
  let html = "";
  if (state.view === "classes") {
    inst.classes.forEach((c, ci) => {
      let rows = "", lo = c.first, hi = c.first + c.max - 1;
      for (let s = 0; s < nSlots; s++) {
        if (byClass[ci][s].length === 0) continue;
        lo = Math.min(lo, s % P);
        hi = Math.max(hi, s % P);
      }
      const outside = lo < c.first || hi >= c.first + c.max;
      for (let p = lo; p <= hi; p++) {
        rows += `<tr><th class="p">${outside ? p + 1 : p - c.first + 1}</th>`;
        for (let d = 0; d < inst.days; d++) {
          const s = d * P + p, here = byClass[ci][s];
          if (here.length === 0) {
            let later = false;
            const inWindow = p >= c.first && p < c.first + c.max;
            for (let q = p + 1; q < c.first + c.max && inWindow && !later; q++) later = byClass[ci][d * P + q].length > 0;
            rows += `<td class="${later ? "gap" : inWindow ? "" : "off"}"></td>`;
          } else {
            const bad = here.some((i) => lessonBad(i, s));
            const split = inst.lessons[here[0]][2].length > 1;
            const text = here.map((i) => {
              const l = inst.lessons[i];
              return `${esc(SUBJECT[l[1]] ?? l[1])}<small>${l[2].map((t) => esc(inst.teachers[t])).join(" + ")}</small>`;
            }).join("");
            rows += `<td class="${bad ? "bad" : split ? "s" : "l"}">${text}</td>`;
          }
        }
        rows += "</tr>";
      }
      const lost = lostByClass[ci].map((i) => SUBJECT[inst.lessons[i][1]] ?? inst.lessons[i][1]);
      html += `<div class="card"><h2>${esc(c.id)}<small>${c.first > 0 ? "вторая смена" : ""}</small></h2><table>${head}${rows}</table>` +
        (lost.length ? `<div class="unassigned">Не поместилось: ${lost.map(esc).join(", ")}</div>` : "") + "</div>";
    });
  } else {
    inst.teachers.forEach((name, ti) => {
      let rows = "", load = 0;
      for (let p = 0; p < P; p++) {
        rows += `<tr class="${p > 0 && p % 8 === 0 && P > 8 ? "shift" : ""}"><th class="p">${p + 1}</th>`;
        for (let d = 0; d < inst.days; d++) {
          const s = d * P + p, here = byTeacher[ti][s];
          load += here.length;
          if (here.length === 0) rows += `<td class="${off[ti].has(s) ? "off" : ""}"></td>`;
          else {
            const bad = here.length > 1 || off[ti].has(s);
            const text = here.map((i) => {
              const l = inst.lessons[i];
              return `${esc(inst.classes[l[0]].id)}<small>${esc(SUBJECT[l[1]] ?? l[1])}</small>`;
            }).join("");
            rows += `<td class="${bad ? "bad" : inst.lessons[here[0]][2].length > 1 ? "s" : "l"}">${text}</td>`;
          }
        }
        rows += "</tr>";
      }
      html += `<div class="card"><h2>${esc(name)}<small>${load} ур. в неделю</small></h2><table>${head}${rows}</table></div>`;
    });
  }
  $("grids").innerHTML = html;
}
render();
</script>
</body>
</html>
