<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание: решения DSATUR</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f5f4ef; --ink: #1c1c1c; --muted: #6b6a65; --line: #d6d4cc;
    --cell: #eef1f6; --cell-ink: #1d2a3a; --split: #e6f1ea; --split-ink: #173d2a;
    --bad: #fbe3e1; --bad-ink: #8a1f1b; --bad-line: #d9534f; --off: #ecebe6; --accent: #2f5fb3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #212125; --ink: #ececec; --muted: #9d9c97; --line: #3a3a40;
      --cell: #26303f; --cell-ink: #d6e2f3; --split: #22382d; --split-ink: #c9ead6;
      --bad: #4a2423; --bad-ink: #ffc9c5; --bad-line: #e0655f; --off: #1e1e21; --accent: #8ab0f0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 64px; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 16px; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > span { color: var(--muted); margin-right: 2px; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:hover { background: var(--panel); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 10px 14px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.bad b { color: var(--bad-line); }
  .note { color: var(--muted); margin: 0 0 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }
  .grids { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th { font-weight: 400; color: var(--muted); font-size: 12px; padding: 2px 0; }
  th.p { width: 20px; text-align: right; padding-right: 5px; }
  td { border: 1px solid var(--line); height: 34px; padding: 1px 3px; font-size: 12px; line-height: 1.2;
       text-align: center; overflow: hidden; }
  td.l { background: var(--cell); color: var(--cell-ink); }
  td.s { background: var(--split); color: var(--split-ink); }
  td.bad { background: var(--bad); color: var(--bad-ink); border: 2px solid var(--bad-line); }
  td.gap { background: repeating-linear-gradient(45deg, var(--bad), var(--bad) 5px, transparent 5px, transparent 10px); border: 2px solid var(--bad-line); }
  td.off { background: var(--off); }
  td small { display: block; color: inherit; opacity: .75; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shift td { border-top: 2px solid var(--muted); }
  .unassigned { margin-top: 6px; font-size: 12px; color: var(--bad-ink); background: var(--bad); border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
<main>
  <h1>Расписание: решения DSATUR</h1>
  <p class="lead">Сетка «день × урок» для каждого класса или учителя. Нарушения жёстких ограничений выделены красным.</p>

  <div class="bar">
    <div class="group" id="instances"><span>Школа</span></div>
    <div class="group" id="solutions"><span>Решение</span></div>
    <div class="group" id="views"><span>Показать</span></div>
  </div>

  <div class="stats" id="stats"></div>
  <p class="note" id="note"></p>
  <div class="legend">
    <span><i style="background:var(--cell)"></i>урок</span>
    <span><i style="background:var(--split)"></i>урок по подгруппам</span>
    <span><i style="background:var(--bad);border-color:var(--bad-line)"></i>накладка или закрытый слот</span>
    <span><i style="background:repeating-linear-gradient(45deg,var(--bad),var(--bad) 3px,transparent 3px,transparent 6px);border-color:var(--bad-line)"></i>окно у класса</span>
    <span><i style="background:var(--off)"></i>учитель недоступен или слот вне смены класса</span>
  </div>
  <div class="grids" id="grids"></div>
</main>

<script>
const DATA = /*DATA*/null;
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const SUBJECT = {
  math: "мат", algebra: "алг", geometry: "геом", kazakh_language: "каз", english_language: "англ",
  physics: "физ", chemistry: "хим", biology: "био", informatics: "инф", kazakh_history: "ист. Каз",
  worldwide_history: "всем. ист", law_basics: "право", russian_language: "рус", russian_literature: "лит",
  natural_science: "естеств", geography: "геогр", military_training: "НВТП", global_competencies: "глоб. комп",
  electives: "электив", physical_education: "физ-ра", art_labour: "труд", music: "муз",
};
const VIEWS = [["classes", "классы"], ["teachers", "учителей"]];
const state = { instance: 0, solution: 0, view: "classes" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function buttons(host, items, current, onPick) {
  host.querySelectorAll("button").forEach((b) => b.remove());
  items.forEach(([value, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", String(value === current));
    b.onclick = () => onPick(value);
    host.appendChild(b);
  });
}

function render() {
  const inst = DATA[state.instance];
  if (state.solution >= inst.solutions.length) state.solution = 0;
  const sol = inst.solutions[state.solution];
  const P = inst.periods, nSlots = inst.days * P;

  buttons($("instances"), DATA.map((d, i) => [i, d.name]), state.instance, (v) => { state.instance = v; render(); });
  buttons($("solutions"), inst.solutions.map((s, i) => [i, s.label]), state.solution, (v) => { state.solution = v; render(); });
  buttons($("views"), VIEWS, state.view, (v) => { state.view = v; render(); });

  const v = sol.violations;
  const stats = [
    ["Уроков", inst.lessons.length, false],
    ["Не поместилось", v.unassigned, true],
    ["Накладки у классов", v.classClash, true],
    ["Накладки у учителей", v.teacherClash, true],
    ["Окна у классов", v.classGap, true],
    ["Учитель в закрытом слоте", v.teacherUnavailable, true],
    ["Вне смены класса", v.classSlot, true],
    ["Повторы предмета в день", sol.soft.sameSubjectInDay, false],
    ["Перекос уроков по дням", sol.soft.dayImbalance, false],
  ];
  $("stats").innerHTML = stats.map(([label, value, hard]) =>
    `<div class="stat${hard && value > 0 ? " bad" : ""}"><b>${value}</b><span>${label}</span></div>`).join("");
  $("note").textContent = `${inst.classes.length} классов, ${inst.teachers.length} учителей, сетка ${inst.days} × ${P}. ${sol.note}`;

  const off = inst.teacherOff.map((slots) => new Set(slots));
  const byClass = inst.classes.map(() => Array.from({ length: nSlots }, () => []));
  const byTeacher = inst.teachers.map(() => Array.from({ length: nSlots }, () => []));
  const lostByClass = inst.classes.map(() => []);
  inst.lessons.forEach((l, i) => {
    const s = sol.slotOf[i];
    if (s < 0) { lostByClass[l[0]].push(i); return; }
    byClass[l[0]][s].push(i);
    l[2].forEach((t) => byTeacher[t][s].push(i));
  });
  const lessonBad = (i, s) => {
    const l = inst.lessons[i];
    if (byClass[l[0]][s].length > 1) return true;
    const c = inst.classes[l[0]], p = s % P;
    if (p < c.first || p >= c.first + c.max) return true;
    return l[2].some((t) => byTeacher[t][s].length > 1 || off[t].has(s));
  };

  const head = `<tr><th class="p"></th>${DAYS.slice(0, inst.days).map((d) => `<th>${d}</th>`).join("")}</tr>`;
  let html = "";
  if (state.view === "classes") {
    inst.classes.forEach((c, ci) => {
      let rows = "", lo = c.first, hi = c.first + c.max - 1;
      for (let s = 0; s < nSlots; s++) {
        if (byClass[ci][s].length === 0) continue;
        lo = Math.min(lo, s % P);
        hi = Math.max(hi, s % P);
      }
      const outside = lo < c.first || hi >= c.first + c.max;
      for (let p = lo; p <= hi; p++) {
        rows += `<tr><th class="p">${outside ? p + 1 : p - c.first + 1}</th>`;
        for (let d = 0; d < inst.days; d++) {
          const s = d * P + p, here = byClass[ci][s];
          if (here.length === 0) {
            let later = false;
            const inWindow = p >= c.first && p < c.first + c.max;
            for (let q = p + 1; q < c.first + c.max && inWindow && !later; q++) later = byClass[ci][d * P + q].length > 0;
            rows += `<td class="${later ? "gap" : inWindow ? "" : "off"}"></td>`;
          } else {
            const bad = here.some((i) => lessonBad(i, s));
            const split = inst.lessons[here[0]][2].length > 1;
            const text = here.map((i) => {
              const l = inst.lessons[i];
              return `${esc(SUBJECT[l[1]] ?? l[1])}<small>${l[2].map((t) => esc(inst.teachers[t])).join(" + ")}</small>`;
            }).join("");
            rows += `<td class="${bad ? "bad" : split ? "s" : "l"}">${text}</td>`;
          }
        }
        rows += "</tr>";
      }
      const lost = lostByClass[ci].map((i) => SUBJECT[inst.lessons[i][1]] ?? inst.lessons[i][1]);
      html += `<div class="card"><h2>${esc(c.id)}<small>${c.first > 0 ? "вторая смена" : ""}</small></h2><table>${head}${rows}</table>` +
        (lost.length ? `<div class="unassigned">Не поместилось: ${lost.map(esc).join(", ")}</div>` : "") + "</div>";
    });
  } else {
    inst.teachers.forEach((name, ti) => {
      let rows = "", load = 0;
      for (let p = 0; p < P; p++) {
        rows += `<tr class="${p > 0 && p % 8 === 0 && P > 8 ? "shift" : ""}"><th class="p">${p + 1}</th>`;
        for (let d = 0; d < inst.days; d++) {
          const s = d * P + p, here = byTeacher[ti][s];
          load += here.length;
          if (here.length === 0) rows += `<td class="${off[ti].has(s) ? "off" : ""}"></td>`;
          else {
            const bad = here.length > 1 || off[ti].has(s);
            const text = here.map((i) => {
              const l = inst.lessons[i];
              return `${esc(inst.classes[l[0]].id)}<small>${esc(SUBJECT[l[1]] ?? l[1])}</small>`;
            }).join("");
            rows += `<td class="${bad ? "bad" : inst.lessons[here[0]][2].length > 1 ? "s" : "l"}">${text}</td>`;
          }
        }
        rows += "</tr>";
      }
      html += `<div class="card"><h2>${esc(name)}<small>${load} ур. в неделю</small></h2><table>${head}${rows}</table></div>`;
    });
  }
  $("grids").innerHTML = html;
}
render();
</script>
</body>
</html>
