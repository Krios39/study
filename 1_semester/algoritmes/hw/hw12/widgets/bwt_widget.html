<div id="bw" style="border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 10px 0; margin: 12px 0; font-size: 14px;">
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center;">
        <label>Text <input id="bw-text" value="banana" maxlength="14" style="width: 150px; font-family: monospace;"></label>
        <label>Pattern <input id="bw-pat" value="ana" maxlength="10" style="width: 90px; font-family: monospace;"></label>
        <label>Link copies of <select id="bw-letter"></select></label>
    </div>
    <div style="overflow-x: auto;"><svg id="bw-svg" style="display: block; margin-top: 8px;"></svg></div>
    <div id="bw-out"></div>
    <div style="font-size: 13px; color: #475569;">Rows are all rotations of the text, sorted. F is the first column, L the last; L is the BWT. The lines link the k-th copy of a letter in L to the k-th copy in F: it is the same letter of the text. Green rows start with the pattern.</div>
</div>
<script>
window.addEventListener("load", function () {
    const $ = id => document.getElementById(id);
    let last = "";

    function draw() {
        const s = $("bw-text").value.replace(/[\s$]/g, "") + "$", p = $("bw-pat").value.replace(/\s/g, ""), n = s.length;
        const rows = [...Array(n).keys()].map(i => ({ i, r: s.slice(i) + s.slice(0, i) })).sort((a, b) => (a.r < b.r ? -1 : 1));
        const F = rows.map(x => x.r[0]), L = rows.map(x => x.r[n - 1]);
        const letters = [...new Set(s)].filter(c => c !== "$").sort();
        if (letters.join("") !== last) {
            const keep = $("bw-letter").value;
            $("bw-letter").innerHTML = letters.map(c => `<option>${c}</option>`).join("");
            $("bw-letter").value = letters.includes(keep) ? keep : letters[0] || "";
            last = letters.join("");
        }
        const sel = $("bw-letter").value;
        const C = 20, R = 22, X0 = 30, Y0 = 22, gap = 110;
        const xF2 = X0 + n * C + gap;
        const C0 = {};
        F.forEach((c, r) => { if (!(c in C0)) C0[c] = r; });
        const occ = (c, i) => L.slice(0, i).filter(x => x === c).length;
        let lo = 0, hi = n;
        const steps = [];
        for (let j = p.length - 1; j >= 0 && lo < hi; j--) {
            const c = p[j];
            if (!(c in C0)) { lo = hi = 0; steps.push([p.slice(j), 0, 0]); break; }
            lo = C0[c] + occ(c, lo); hi = C0[c] + occ(c, hi);
            steps.push([p.slice(j), lo, hi]);
        }
        const green = r => p && r >= lo && r < hi;
        let g = `<text x="${X0 + C / 2}" y="12" font-size="11" fill="#666" text-anchor="middle">F</text><text x="${X0 + (n - 0.5) * C}" y="12" font-size="11" fill="#666" text-anchor="middle">L</text><text x="${xF2 + C / 2}" y="12" font-size="11" fill="#666" text-anchor="middle">F</text>`;
        rows.forEach((x, r) => {
            const y = Y0 + r * R;
            if (green(r)) g += `<rect x="0" y="${y}" width="${X0 + n * C}" height="${R}" fill="#dcfce7"/>`;
            g += `<text x="${X0 - 8}" y="${y + 15}" font-size="11" fill="#999" text-anchor="end">${r}</text>`;
            for (let j = 0; j < n; j++) {
                const edge = j === 0 || j === n - 1;
                g += `<text x="${X0 + j * C + C / 2}" y="${y + 15}" font-family="monospace" font-size="14" text-anchor="middle" fill="${edge ? "#111" : "#aaa"}"${edge ? ' font-weight="bold"' : ""}>${x.r[j]}</text>`;
            }
            g += `<text x="${xF2 + C / 2}" y="${y + 15}" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">${F[r]}</text>`;
        });
        g += `<rect x="${X0}" y="${Y0}" width="${C}" height="${n * R}" fill="none" stroke="#999"/><rect x="${X0 + (n - 1) * C}" y="${Y0}" width="${C}" height="${n * R}" fill="none" stroke="#999"/><rect x="${xF2}" y="${Y0}" width="${C}" height="${n * R}" fill="none" stroke="#999"/>`;
        let k = 0;
        L.forEach((c, r) => {
            if (c !== sel) return;
            const to = C0[c] + k;
            g += `<line x1="${X0 + n * C + 2}" y1="${Y0 + r * R + R / 2}" x2="${xF2 - 2}" y2="${Y0 + to * R + R / 2}" stroke="#b45309" stroke-width="1.5"/>`;
            g += `<text x="${X0 + n * C + 8}" y="${Y0 + r * R + R / 2 - 3}" font-size="10" fill="#b45309">${k + 1}</text>`;
            g += `<text x="${xF2 - 8}" y="${Y0 + to * R + R / 2 - 3}" font-size="10" fill="#b45309" text-anchor="end">${k + 1}</text>`;
            k++;
        });
        const svg = $("bw-svg");
        svg.setAttribute("width", xF2 + C + 10);
        svg.setAttribute("height", Y0 + n * R + 4);
        svg.innerHTML = g;
        const runs = t => [...t].filter((c, i) => i === 0 || c !== t[i - 1]).length;
        const bwt = L.join("");
        let row = 0, back = "$";
        for (let step = 1; step < n; step++) { const c = L[row]; back = c + back; row = C0[c] + occ(c, row); }
        let msg = `BWT = <code><b>${bwt}</b></code> (runs of equal letters: ${runs(s)} in the text, ${runs(bwt)} in the BWT). Undo: start in row 0, take L, jump along its line to F, repeat; the letters come out right to left and give <code>${back}</code>.`;
        if (p) msg += `<br>Search <b>${p}</b> from its last letter: ` + steps.map(([q, a, b]) => `<code>${q}</code> → rows ${a < b ? `${a}–${b - 1}` : "none"}`).join(", ") +
            (lo < hi ? `; it occurs at ${rows.slice(lo, hi).map(x => x.i).sort((a, b) => a - b).join(", ")}.` : "; it does not occur.");
        $("bw-out").innerHTML = msg;
    }

    ["bw-text", "bw-pat"].forEach(id => $(id).addEventListener("input", draw));
    $("bw-letter").addEventListener("change", draw);
    draw();
});
</script>
