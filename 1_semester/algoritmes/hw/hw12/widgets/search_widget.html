<div id="sw" style="border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 10px 0; margin: 12px 0; font-size: 14px;">
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center;">
        <label>Example <select id="sw-preset"></select></label>
        <label>Text <input id="sw-text" maxlength="40" style="width: 300px; font-family: monospace;"></label>
        <label>Pattern <input id="sw-pat" maxlength="10" style="width: 90px; font-family: monospace;"></label>
    </div>
    <div style="overflow-x: auto;"><svg id="sw-svg" style="display: block; margin-top: 10px;"></svg></div>
    <div style="font-size: 13px; color: #475569;">The number under a text letter is how many times the method compared that letter. Empty: never looked at. Underlined: a match.</div>
</div>
<script>
window.addEventListener("load", function () {
    const $ = id => document.getElementById(id);
    const presets = [
        ["nearly periodic", "aaaaaaaabaaaaaaaaaabaaaa", "aaaab"],
        ["nearly periodic, reversed", "aaaaaaaabaaaaaaaaaabaaaa", "baaaa"],
        ["periodic", "aaaaaaaaaaaaaaaaaaaa", "aaaaa"],
        ["English letters", "thequickbrownfoxjumpsoverthelazydog", "lazy"],
        ["abracadabra", "abracadabra", "abra"],
    ];

    function kmpFail(p) {
        const f = new Array(p.length).fill(0);
        let k = 0;
        for (let i = 1; i < p.length; i++) {
            while (true) {
                if (p[i] === p[k]) { k++; break; }
                if (k === 0) break;
                k = f[k - 1];
            }
            f[i] = k;
        }
        return f;
    }

    function reads(method, t, p) {
        const n = t.length, m = p.length, r = new Array(n).fill(0), found = [];
        if (!m || m > n) return { r, found };
        if (method === "naive") {
            for (let pos = 0; pos + m <= n; pos++) {
                let j = 0;
                while (j < m) { r[pos + j]++; if (t[pos + j] !== p[j]) break; j++; }
                if (j === m) found.push(pos);
            }
        } else if (method === "KMP") {
            const f = kmpFail(p);
            let k = 0;
            for (let i = 0; i < n; i++) {
                while (true) {
                    r[i]++;
                    if (t[i] === p[k]) { k++; if (k === m) { found.push(i + 1 - m); k = f[m - 1]; } break; }
                    if (k === 0) break;
                    k = f[k - 1];
                }
            }
        } else {
            const shift = {};
            for (let i = 0; i < m - 1; i++) shift[p[i]] = m - 1 - i;
            let pos = 0;
            while (pos + m <= n) {
                let j = m - 1;
                while (j >= 0) { r[pos + j]++; if (t[pos + j] !== p[j]) break; j--; }
                if (j < 0) found.push(pos);
                pos += shift[t[pos + m - 1]] || m;
            }
        }
        return { r, found };
    }

    const shade = c => c === 0 ? "#fff" : c === 1 ? "#e5e7eb" : c === 2 ? "#9ca3af" : "#374151";

    function draw() {
        const t = $("sw-text").value.replace(/\s/g, ""), p = $("sw-pat").value.replace(/\s/g, "");
        const C = 22, L = 80, top = 16, n = t.length;
        const rows = ["naive", "KMP", "Horspool"].map(m => [m, reads(m, t, p)]);
        const W = L + n * C + 120, H = top + C * 1.6 + rows.length * (C + 6) + 4;
        let s = "";
        for (let i = 0; i < n; i++) {
            const x = L + i * C;
            s += `<text x="${x + C / 2}" y="${top - 4}" font-size="9" fill="#999" text-anchor="middle">${i}</text>`;
            s += `<rect x="${x}" y="${top}" width="${C}" height="${C}" fill="#fff" stroke="#ccc"/>`;
            s += `<text x="${x + C / 2}" y="${top + 15}" font-family="monospace" font-size="14" text-anchor="middle">${t[i]}</text>`;
        }
        for (const pos of rows[0][1].found) s += `<line x1="${L + pos * C + 2}" x2="${L + (pos + p.length) * C - 2}" y1="${top + C + 3}" y2="${top + C + 3}" stroke="#111" stroke-width="2"/>`;
        s += `<text x="0" y="${top + 15}" font-size="13" fill="#666">text</text>`;
        rows.forEach(([name, { r }], k) => {
            const y = top + C * 1.6 + k * (C + 6);
            s += `<text x="0" y="${y + 15}" font-size="13">${name}</text>`;
            for (let i = 0; i < n; i++) {
                const x = L + i * C;
                s += `<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="${shade(r[i])}" stroke="#ddd"/>`;
                if (r[i]) s += `<text x="${x + C / 2}" y="${y + 15}" font-size="12" text-anchor="middle" fill="${r[i] > 2 ? "#fff" : "#111"}">${r[i]}</text>`;
            }
            s += `<text x="${L + n * C + 12}" y="${y + 15}" font-size="13"><tspan font-weight="bold">${r.reduce((a, b) => a + b, 0)}</tspan> comparisons</text>`;
        });
        const svg = $("sw-svg");
        svg.setAttribute("width", W); svg.setAttribute("height", H);
        svg.innerHTML = s;
    }

    presets.forEach(([name], i) => $("sw-preset").add(new Option(name, i)));
    $("sw-preset").addEventListener("change", () => { const [, t, p] = presets[$("sw-preset").value]; $("sw-text").value = t; $("sw-pat").value = p; draw(); });
    $("sw-text").addEventListener("input", draw);
    $("sw-pat").addEventListener("input", draw);
    $("sw-text").value = presets[0][1]; $("sw-pat").value = presets[0][2];
    draw();
});
</script>
