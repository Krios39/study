x-ss-common: &ss-common
  image: niis/xroad-security-server-sidecar:7.8.3
  environment: &ss-env
    XROAD_TOKEN_PIN: 123456xrd!
    XROAD_ADMIN_USER: xrd
    XROAD_ADMIN_PASSWORD: secret
    XROAD_LOG_LEVEL: INFO
  # одинаковые лимиты на ноуте и на VM — иначе среды несравнимы (план, 8.2)
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 4G
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 120s
  networks:
    - xroad-network
  depends_on:
    - cs
    - ca

services:
  cs:
    image: niis/xroad-central-server:noble-7.8.3
    container_name: cs
    environment:
      XROAD_TOKEN_PIN: 123456xrd!
    ports:
      - 4000:4000
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
    volumes:
      - cs-db-volume:/var/lib/postgresql/16/main
      - cs-conf-volume:/etc/xroad
    networks:
      - xroad-network

  ca:
    image: ghcr.io/nordic-institute/xrddev-testca:latest
    container_name: ca
    ports:
      - 8888:8888   # CA: POST /testca/sign, OCSP на /, сертификаты на /testca/certs/
      - 8899:8899   # TSA
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/testca/certs/"]
      interval: 5s
      retries: 40
    volumes:
      - ca-volume:/home/ca
    networks:
      - xroad-network

  # ss0 — management SS (регистрация членов), в измеряемом пути не участвует
  ss0:
    <<: *ss-common
    container_name: ss0
    ports:
      - 4100:4000   # admin UI (https)
      - 4110:8080   # IS-интерфейс, http
      - 4111:8443   # IS-интерфейс, https
    volumes:
      - ss0-db-volume:/var/lib/postgresql/16/main
      - ss0-conf-volume:/etc/xroad
      - ss0-archive-volume:/var/lib/xroad

  # ss1 — consumer
  ss1:
    <<: *ss-common
    container_name: ss1
    ports:
      - 4200:4000
      - 4210:8080
      - 4211:8443
    volumes:
      - ss1-db-volume:/var/lib/postgresql/16/main
      - ss1-conf-volume:/etc/xroad
      - ss1-archive-volume:/var/lib/xroad

  # ss2 — provider A
  ss2:
    <<: *ss-common
    container_name: ss2
    ports:
      - 4300:4000
      - 4310:8080
      - 4311:8443
    volumes:
      - ss2-db-volume:/var/lib/postgresql/16/main
      - ss2-conf-volume:/etc/xroad
      - ss2-archive-volume:/var/lib/xroad

  # ss3 — provider B
  ss3:
    <<: *ss-common
    container_name: ss3
    ports:
      - 4400:4000
      - 4410:8080
      - 4411:8443
    volumes:
      - ss3-db-volume:/var/lib/postgresql/16/main
      - ss3-conf-volume:/etc/xroad
      - ss3-archive-volume:/var/lib/xroad

  # эхо-сервис: GET /echo?size=N отдаёт N байт, POST /echo возвращает тело.
  # Через X-Road: ss1:8080/r1/DEV/MEMBER/SS2-CODE/ECHO/echo   Напрямую (baseline-0): localhost:8081/echo
  is-provider:
    build: ./echo
    container_name: is-provider
    ports:
      - 8081:8080
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      retries: 20
    networks:
      - xroad-network

  # hurl — инициализация через REST API. Не стартует с `up`, только `docker compose run --rm hurl ...`
  hurl:
    image: ghcr.io/orange-opensource/hurl:8.0.1
    profiles: ["init"]
    volumes:
      - ./hurl:/hurl-src:ro
      - ca-volume:/hurl-files/ca:ro
    networks:
      - xroad-network
    depends_on:
      cs:
        condition: service_healthy
      ca:
        condition: service_healthy
      ss0:
        condition: service_healthy
      ss1:
        condition: service_healthy
      ss2:
        condition: service_healthy
      ss3:
        condition: service_healthy
      is-provider:
        condition: service_healthy

volumes:
  cs-db-volume:
    name: cs-db-data
  cs-conf-volume:
    name: cs-conf-data
  ca-volume:
    name: ca-data
  ss0-db-volume:
    name: ss0-db-data
  ss0-conf-volume:
    name: ss0-conf-data
  ss0-archive-volume:
    name: ss0-archive-data
  ss1-db-volume:
    name: ss1-db-data
  ss1-conf-volume:
    name: ss1-conf-data
  ss1-archive-volume:
    name: ss1-archive-data
  ss2-db-volume:
    name: ss2-db-data
  ss2-conf-volume:
    name: ss2-conf-data
  ss2-archive-volume:
    name: ss2-archive-data
  ss3-db-volume:
    name: ss3-db-data
  ss3-conf-volume:
    name: ss3-conf-data
  ss3-archive-volume:
    name: ss3-archive-data

networks:
  xroad-network:
    name: xroad-network
    driver: bridge
